<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Memory Match Game</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#100d21;color:#f5f4ff;font-family:Arial,sans-serif}
    .game{width:min(720px,100%);padding:30px;border:1px solid #393456;border-radius:28px;background:#17142b;box-shadow:0 24px 60px #0008}
    header{display:flex;justify-content:space-between;gap:16px;align-items:start}
    .tag{margin:0 0 5px;color:#c9baff;font-weight:bold;letter-spacing:.13em;font-size:.75rem}
    h1{margin:0;font-size:clamp(2rem,8vw,3.2rem)}
    header p:not(.tag){color:#b8b4ce}
    button{font:inherit}
    .new{padding:11px 15px;border:1px solid #b8a9ff;border-radius:12px;background:#352967;color:white;cursor:pointer;font-weight:bold}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0 18px}
    .stats div{padding:13px;border:1px solid #393456;border-radius:14px;background:#110f24}
    .stats span{display:block;color:#b8b4ce;font-size:.8rem}
    .stats strong{font:1.3rem monospace}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .card{height:clamp(72px,15vw,116px);border:2px solid #b8a9ff;border-radius:16px;background:#6d4fe0;color:white;cursor:pointer;font-size:clamp(1.7rem,5vw,2.8rem);font-weight:bold;box-shadow:0 7px 14px #0004}
    .card:hover:not(:disabled){background:#876bff;transform:translateY(-2px)}
    .card.open{background:#f7f0ff;color:#35235c}
    .card.match{background:#f887ba;border-color:#ffc6de;color:#42203c}
    .status{text-align:center;color:#b8b4ce;margin:20px 0 0}
    @media(max-width:480px){.game{padding:20px}header{flex-direction:column}.new{width:100%}.board{gap:8px}.card{height:20vw}}
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div>
        <p class="tag">MEMORY TRAINING</p>
        <h1>Memory Match</h1>
        <p>Find every matching pair using the fewest moves.</p>
      </div>
      <button class="new" id="new">New game</button>
    </header>

    <section class="stats">
      <div><span>Moves</span><strong id="moves">0</strong></div>
      <div><span>Time</span><strong id="time">00:00</strong></div>
      <div><span>Pairs</span><strong id="pairs">0 / 8</strong></div>
    </section>

    <section class="board" id="board" aria-label="Memory cards"></section>
    <p class="status" id="status">Choose a card to begin.</p>
  </main>

  <script>
    const symbols = [
      "\u{1F680}", "\u{1F3AE}", "\u{1F3A7}", "\u{26A1}",
      "\u{1F308}", "\u{1FA90}", "\u{1F3AF}", "\u{1F48E}"
    ];

    const board = document.querySelector("#board");
    const movesEl = document.querySelector("#moves");
    const timeEl = document.querySelector("#time");
    const pairsEl = document.querySelector("#pairs");
    const statusEl = document.querySelector("#status");

    let open = [];
    let moves = 0;
    let pairs = 0;
    let seconds = 0;
    let locked = false;
    let started = false;
    let timer;

    const shuffle = (items) => [...items].sort(() => Math.random() - 0.5);

    const formatTime = (value) =>
      `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`;

    function beginTimer() {
      if (started) return;

      started = true;
      timer = setInterval(() => {
        seconds++;
        timeEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function check() {
      locked = true;
      moves++;
      movesEl.textContent = moves;

      const [first, second] = open;

      if (first.dataset.symbol === second.dataset.symbol) {
        first.className = "card match";
        second.className = "card match";
        first.disabled = true;
        second.disabled = true;

        pairs++;
        pairsEl.textContent = `${pairs} / 8`;
        open = [];
        locked = false;
        statusEl.textContent = "Match found! Keep going.";

        if (pairs === 8) {
          clearInterval(timer);
          statusEl.textContent = `You won in ${moves} moves and ${formatTime(seconds)}!`;
        }
      } else {
        statusEl.textContent = "Not a match. Try again.";

        setTimeout(() => {
          first.className = "card";
          second.className = "card";
          first.textContent = "?";
          second.textContent = "?";
          open = [];
          locked = false;
        }, 850);
      }
    }

    function flip(card) {
      if (
        locked ||
        card.classList.contains("open") ||
        card.classList.contains("match")
      ) return;

      beginTimer();
      card.className = "card open";
      card.textContent = card.dataset.symbol;
      open.push(card);

      if (open.length === 2) check();
    }

    function reset() {
      clearInterval(timer);

      open = [];
      moves = 0;
      pairs = 0;
      seconds = 0;
      locked = false;
      started = false;

      movesEl.textContent = "0";
      timeEl.textContent = "00:00";
      pairsEl.textContent = "0 / 8";
      statusEl.textContent = "Choose a card to begin.";

      const cards = shuffle([...symbols, ...symbols]).map((symbol, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.textContent = "?";
        card.dataset.symbol = symbol;
        card.setAttribute("aria-label", `Hidden card ${index + 1}`);
        card.onclick = () => flip(card);
        return card;
      });

      board.replaceChildren(...cards);
    }

    document.querySelector("#new").onclick = reset;
    reset();
  </script>
</body>
</html>
