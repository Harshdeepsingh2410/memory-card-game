<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive Memory Card Matching Game built with HTML, CSS and JavaScript.">
  <title>Memory Match | Card Matching Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="hero">
      <p class="eyebrow">JAVASCRIPT GAME PROJECT</p>
      <h1>Memory Match</h1>
      <p class="subtitle">Flip the cards, find every matching pair, and beat your best score.</p>
    </header>

    <section class="stats" aria-label="Game statistics">
      <div class="stat-card">
        <span class="stat-label">Moves</span>
        <strong id="moves">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Time</span>
        <strong id="timer">00:00</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Score</span>
        <strong id="score">1000</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Best</span>
        <strong id="bestScore">—</strong>
      </div>
    </section>

    <div class="controls">
      <button id="newGameBtn" class="primary-btn" type="button">New Game</button>
    </div>

    <section id="gameBoard" class="game-board" aria-label="Memory card board"></section>

    <p id="status" class="status" aria-live="polite">Find all 8 matching pairs.</p>
  </main>

  <div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal-card">
      <div class="trophy" aria-hidden="true">🏆</div>
      <p class="eyebrow">GAME COMPLETE</p>
      <h2 id="winTitle">You matched them all!</h2>
      <p id="winMessage"></p>
      <button id="playAgainBtn" class="primary-btn" type="button">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
