<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A fully functional Memory Card Matching Game built with HTML, CSS and JavaScript.">
  <title>Memory Match Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">JAVASCRIPT PROJECT</p>
      <h1>Memory Match</h1>
      <p class="subtitle">Flip the cards, find every matching pair, and beat your best score.</p>
    </header>

    <section class="stats" aria-label="Game statistics">
      <div class="stat"><span>Moves</span><strong id="moves">0</strong></div>
      <div class="stat"><span>Time</span><strong id="timer">00:00</strong></div>
      <div class="stat"><span>Score</span><strong id="score">1000</strong></div>
      <div class="stat"><span>Best</span><strong id="best">—</strong></div>
    </section>

    <div class="controls">
      <button id="newGame" class="button" type="button">New Game</button>
    </div>

    <section id="board" class="board" aria-label="Memory cards"></section>
    <p id="status" class="status" aria-live="polite">Find all 8 matching pairs.</p>
  </main>

  <div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal-card">
      <div class="trophy" aria-hidden="true">🏆</div>
      <p class="eyebrow">GAME COMPLETE</p>
      <h2 id="winTitle">Congratulations!</h2>
      <p id="winText"></p>
      <button id="playAgain" class="button" type="button">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
